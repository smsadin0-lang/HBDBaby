<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Photo Gallery 📸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #fecfef 0%, #ff9a9e 100%); padding: 20px; text-align: center; }
        h1 { color: #d63384; margin-bottom: 20px; }
        
        /* Photo Grid */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .photo-card { background: white; padding: 10px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .photo-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        .photo-card p { margin-top: 10px; color: #d63384; font-weight: bold; }

        .btn-back { display: inline-block; margin-top: 30px; background: #d63384; color: white; text-decoration: none; padding: 10px 20px; border-radius: 20px; }
    </style>
</head>
